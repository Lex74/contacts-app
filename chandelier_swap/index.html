<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Замена люстры</title>
	<style>
		:root { --ui: #202124; --text: #fff; --sub:#bdbdbd; --accent:#4f8cff; }
		body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background:#111; color:var(--text); }
		header { padding: 12px 16px; border-bottom: 1px solid #2a2a2a; display:flex; align-items:center; gap:12px; }
		header h1 { font-size: 18px; margin: 0; font-weight: 600; }
		.controls { display:flex; gap:14px; align-items:center; flex-wrap: wrap; }
		.panel { background: var(--ui); border:1px solid #2a2a2a; border-radius: 10px; padding:12px; margin:16px; }
		label { font-size: 13px; color: var(--sub); }
		input[type="file"] { color: #ddd; }
		.grid { display:grid; grid-template-columns: 320px 1fr; gap:16px; }
		@media (max-width: 920px) { .grid { grid-template-columns: 1fr; } }
		.row { display:flex; align-items:center; gap:8px; margin:8px 0; }
		.slider { width: 100%; }
		button { background: var(--accent); color:#fff; border:none; padding:8px 12px; border-radius:8px; cursor:pointer; }
		button.secondary { background: #333; }
		canvas { background:#000; max-width: 100%; border-radius: 10px; }
	</style>
</head>
<body>
	<header>
		<h1>Замена люстры</h1>
		<div class="controls">
			<label>
				Фон:
				<input id="bgInput" type="file" accept="image/*" />
			</label>
			<label>
				Люстра:
				<input id="fgInput" type="file" accept="image/*" />
			</label>
			<button id="exportBtn" class="secondary">Скачать результат PNG</button>
		</div>
	</header>

	<div class="grid">
		<div class="panel">
			<div class="row">
				<label style="min-width:120px">Масштаб</label>
				<input id="scale" class="slider" type="range" min="0.1" max="3" step="0.01" value="0.8" />
				<span id="scaleVal">0.80×</span>
			</div>
			<div class="row">
				<label style="min-width:120px">Поворот</label>
				<input id="rotation" class="slider" type="range" min="-180" max="180" step="0.1" value="0" />
				<span id="rotVal">0°</span>
			</div>
			<div class="row">
				<label style="min-width:120px">Непрозрачность</label>
				<input id="opacity" class="slider" type="range" min="0" max="1" step="0.01" value="1" />
				<span id="opVal">100%</span>
			</div>
			<hr style="border-color:#2a2a2a" />
			<p style="margin:6px 0 6px; color:#bdbdbd">Автовырез по цвету фона (подходит для однотонного фона как на фото люстры):</p>
			<div class="row">
				<label style="min-width:120px">Порог</label>
				<input id="tolerance" class="slider" type="range" min="5" max="80" step="1" value="28" />
				<span id="tolVal">28</span>
			</div>
			<div class="row">
				<label style="min-width:120px">Смягчение края</label>
				<input id="feather" class="slider" type="range" min="0" max="6" step="0.1" value="2" />
				<span id="featherVal">2.0px</span>
			</div>
			<div class="row">
				<button id="autoCut">Вырезать фон</button>
				<button id="resetFg" class="secondary">Сбросить вырез</button>
			</div>
			<p style="font-size:12px;color:#9aa0a6">Подсказка: после загрузки потяните люстру мышкой, колесиком — масштаб, удерживайте Shift при перетаскивании для лучшей точности.</p>
		</div>

		<div class="panel" style="overflow:auto">
			<canvas id="canvas"></canvas>
		</div>
	</div>

	<script>
	const bgInput = document.getElementById('bgInput');
	const fgInput = document.getElementById('fgInput');
	const canvasEl = document.getElementById('canvas');
	const scaleEl = document.getElementById('scale');
	const rotationEl = document.getElementById('rotation');
	const opacityEl = document.getElementById('opacity');
	const toleranceEl = document.getElementById('tolerance');
	const featherEl = document.getElementById('feather');
	const exportBtn = document.getElementById('exportBtn');
	const autoCutBtn = document.getElementById('autoCut');
	const resetFgBtn = document.getElementById('resetFg');

	const scaleVal = document.getElementById('scaleVal');
	const rotVal = document.getElementById('rotVal');
	const opVal = document.getElementById('opVal');
	const tolVal = document.getElementById('tolVal');
	const featherVal = document.getElementById('featherVal');

	let bgImg = new Image();
	let fgImg = new Image();
	let fgOriginalBitmap = null; // ImageBitmap for original chandelier
	let fgBitmap = null; // current processed bitmap
	let dragging = false;
	let offsetX = 0, offsetY = 0; // object top-left
	let startDragX = 0, startDragY = 0;
	let startOffsetX = 0, startOffsetY = 0;
	let scale = parseFloat(scaleEl.value);
	let rotation = parseFloat(rotationEl.value) * Math.PI/180;
	let opacity = parseFloat(opacityEl.value);

	function fitCanvasToBackground() {
		canvasEl.width = bgImg.naturalWidth || bgImg.width;
		canvasEl.height = bgImg.naturalHeight || bgImg.height;
	}

	function draw() {
		const ctx = canvasEl.getContext('2d');
		ctx.clearRect(0,0,canvasEl.width, canvasEl.height);
		if (bgImg && bgImg.src) {
			ctx.drawImage(bgImg, 0, 0, canvasEl.width, canvasEl.height);
		}
		if (fgBitmap) {
			ctx.save();
			ctx.globalAlpha = opacity;
			ctx.translate(offsetX, offsetY);
			ctx.translate(fgBitmap.width*scale/2, fgBitmap.height*scale/2);
			ctx.rotate(rotation);
			ctx.translate(-fgBitmap.width*scale/2, -fgBitmap.height*scale/2);
			ctx.drawImage(fgBitmap, 0, 0, fgBitmap.width*scale, fgBitmap.height*scale);
			ctx.restore();
		}
	}

	function updateUIValues() {
		scaleVal.textContent = scale.toFixed(2) + '×';
		rotVal.textContent = (rotation*180/Math.PI).toFixed(1) + '°';
		opVal.textContent = Math.round(opacity*100) + '%';
		tolVal.textContent = toleranceEl.value;
		featherVal.textContent = featherEl.value + 'px';
	}

	function getEventPos(e) {
		const rect = canvasEl.getBoundingClientRect();
		const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
		const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
		return {x, y};
	}

	canvasEl.addEventListener('mousedown', e => {
		if (!fgBitmap) return;
		dragging = true;
		const pos = getEventPos(e);
		startDragX = pos.x; startDragY = pos.y;
		startOffsetX = offsetX; startOffsetY = offsetY;
	});
	window.addEventListener('mousemove', e => {
		if (!dragging) return;
		const pos = getEventPos(e);
		offsetX = startOffsetX + (pos.x - startDragX);
		offsetY = startOffsetY + (pos.y - startDragY);
		draw();
	});
	window.addEventListener('mouseup', () => dragging = false);

	canvasEl.addEventListener('wheel', e => {
		if (!fgBitmap) return;
		const delta = e.deltaY < 0 ? 1.05 : 0.95;
		scale = Math.min(3, Math.max(0.1, scale * delta));
		scaleEl.value = scale;
		updateUIValues();
		draw();
		if (e.ctrlKey) e.preventDefault();
	}, { passive: false });

	scaleEl.addEventListener('input', e => { scale = parseFloat(e.target.value); updateUIValues(); draw(); });
	rotationEl.addEventListener('input', e => { rotation = parseFloat(e.target.value) * Math.PI/180; updateUIValues(); draw(); });
	opacityEl.addEventListener('input', e => { opacity = parseFloat(e.target.value); updateUIValues(); draw(); });
	toleranceEl.addEventListener('input', updateUIValues);
	featherEl.addEventListener('input', updateUIValues);

	function fileToImage(file) {
		return new Promise((resolve, reject) => {
			const url = URL.createObjectURL(file);
			const img = new Image();
			img.onload = () => resolve(img);
			img.onerror = reject;
			img.src = url;
		});
	}

	bgInput.addEventListener('change', async (e) => {
		const f = e.target.files[0]; if (!f) return;
		bgImg = await fileToImage(f);
		fitCanvasToBackground();
		draw();
	});

	fgInput.addEventListener('change', async (e) => {
		const f = e.target.files[0]; if (!f) return;
		fgImg = await fileToImage(f);
		fgOriginalBitmap = await createImageBitmap(fgImg);
		fgBitmap = fgOriginalBitmap;
		// place near top center
		offsetX = (canvasEl.width - fgBitmap.width*scale)/2;
		offsetY = Math.max(10, canvasEl.height*0.15);
		draw();
	});

	function rgbaDist(a, b) {
		const dr = a[0]-b[0], dg=a[1]-b[1], db=a[2]-b[2];
		return Math.sqrt(dr*dr+dg*dg+db*db);
	}

	function featherAlpha(alpha, w, h, radius) {
		if (radius <= 0) return alpha;
		const rad = Math.round(radius);
		const out = new Uint8ClampedArray(alpha.length);
		// simple box blur
		for (let y=0; y<h; y++) {
			for (let x=0; x<w; x++) {
				let sum=0, cnt=0;
				for (let dy=-rad; dy<=rad; dy++) {
					const yy = y+dy; if (yy<0||yy>=h) continue;
					for (let dx=-rad; dx<=rad; dx++) {
						const xx = x+dx; if (xx<0||xx>=w) continue;
						sum += alpha[yy*w+xx]; cnt++;
					}
				}
				out[y*w+x] = sum/cnt;
			}
		}
		return out;
	}

	async function autoCutout() {
		if (!fgOriginalBitmap) return;
		const w = fgOriginalBitmap.width, h = fgOriginalBitmap.height;
		const off = new OffscreenCanvas(w, h);
		const ctx = off.getContext('2d');
		ctx.drawImage(fgOriginalBitmap, 0, 0);
		const data = ctx.getImageData(0,0,w,h);
		const px = data.data;
		// Estimate background color from border
		let r=0,g=0,b=0,cnt=0;
		const border = Math.max(2, Math.round(Math.min(w,h)*0.04));
		function add(x,y){ const i=(y*w+x)*4; r+=px[i]; g+=px[i+1]; b+=px[i+2]; cnt++; }
		for (let x=0;x<w;x++){ for (let y=0;y<border;y++){ add(x,y); add(x,h-1-y);} }
		for (let y=border; y<h-border; y++){ for (let x=0; x<border; x++){ add(x,y); add(w-1-x,y);} }
		const bg = [r/cnt, g/cnt, b/cnt];
		const tol = parseFloat(toleranceEl.value);
		const alpha = new Uint8ClampedArray(w*h);
		for (let y=0; y<h; y++){
			for (let x=0; x<w; x++){
				const i=(y*w+x)*4;
				const d = rgbaDist([px[i],px[i+1],px[i+2]], bg);
				alpha[y*w+x] = d < tol ? 0 : 255;
			}
		}
		const feather = parseFloat(featherEl.value);
		const fa = featherAlpha(alpha, w, h, feather);
		for (let y=0; y<h; y++){
			for (let x=0; x<w; x++){
				const i=(y*w+x)*4;
				px[i+3] = fa[y*w+x];
			}
		}
		ctx.putImageData(data, 0, 0);
		fgBitmap = await createImageBitmap(off);
		draw();
	}

	autoCutBtn.addEventListener('click', autoCutout);
	resetFgBtn.addEventListener('click', async () => {
		if (!fgImg.src) return;
		fgOriginalBitmap = await createImageBitmap(fgImg);
		fgBitmap = fgOriginalBitmap;
		draw();
	});

	exportBtn.addEventListener('click', () => {
		const link = document.createElement('a');
		link.download = 'chandelier_swapped.png';
		link.href = canvasEl.toDataURL('image/png');
		link.click();
	});

	updateUIValues();
	</script>
</body>
</html>
